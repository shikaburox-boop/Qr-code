<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหารประจำโต๊ะ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-44 hidden" id="main-body">

    <div class="bg-rose-600 text-white p-4 sticky top-0 shadow-md flex justify-between items-center z-50">
        <h1 class="text-xl font-bold">🍲 โต๊ะที่ <span id="table-heading">-</span></h1>
        <div id="timer" class="bg-rose-800 px-3 py-1 rounded-full text-xs font-semibold">กำลังคำนวณเวลา...</div>
    </div>

    <div class="p-4 max-w-md mx-auto space-y-6">
        
        <div>
            <h2 class="font-bold text-slate-800 text-lg mb-2 border-l-4 border-rose-600 pl-2">🥩 หมวดเนื้อสัตว์พรีเมียม</h2>
            <div class="space-y-3">
                <script>
                    function createMenuCard(name, price) {
                        document.write(`
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                                <div><h3 class="font-bold text-slate-800">${name}</h3><p class="text-sm text-rose-600 font-semibold">${price} บาท</p></div>
                                <div class="flex items-center space-x-3">
                                    <button onclick="changeQty('${name}', ${price}, -1)" class="w-8 h-8 bg-slate-200 rounded-full font-bold text-lg text-slate-700">-</button>
                                    <button onclick="changeQty('${name}', ${price}, 1)" class="w-8 h-8 bg-rose-600 text-white rounded-full font-bold text-lg">+</button>
                                </div>
                            </div>
                        `);
                    }
                    createMenuCard('เนื้อริบอายวากิวสไลด์', 129);
                    createMenuCard('เนื้อเสือร้องไห้ออสเตรเลีย', 99);
                    createMenuCard('หมูสามชั้นคุโรบุตะ', 79);
                    createMenuCard('สันคอหมูสไลด์เกรด A', 69);
                    createMenuCard('ตับหมูสดสไลด์', 49);
                </script>
            </div>
        </div>

        <div>
            <h2 class="font-bold text-slate-800 text-lg mb-2 border-l-4 border-cyan-500 pl-2">🐟 หมวดอาหารทะเล</h2>
            <div class="space-y-3">
                <script>
                    createMenuCard('กุ้งแชบ๊วยแกะเปลือก', 89);
                    createMenuCard('ปลาหมึกกล้วยหั่นชิ้น', 79);
                    createMenuCard('หอยแมลงภู่นิวซีแลนด์', 99);
                    createMenuCard('เนื้อปลาแซลมอนสดนอร์เวย์', 119);
                    createMenuCard('แมงกะพรุนหมักน้ำมันงา', 59);
                </script>
            </div>
        </div>

        <div>
            <h2 class="font-bold text-slate-800 text-lg mb-2 border-l-4 border-green-500 pl-2">🥬 หมวดผัก & ของเคียง</h2>
            <div class="space-y-3">
                <script>
                    createMenuCard('ชุดผักสุขภาพรวมมิตร', 69);
                    createMenuCard('เห็ดเข็มทองสด', 25);
                    createMenuCard('เต้าหู้ชีสลาวา', 49);
                    createMenuCard('ลูกชิ้นปลาภูเก็ต', 39);
                    createMenuCard('ไข่ไก่สดอนามัย (ฟอง)', 12);
                </script>
            </div>
        </div>

        <div>
            <h2 class="font-bold text-slate-800 text-lg mb-2 border-l-4 border-amber-500 pl-2">🥤 เครื่องดื่ม & ของหวาน</h2>
            <div class="space-y-3">
                <script>
                    createMenuCard('น้ำดื่มสะอาดพร้อมน้ำแข็ง', 15);
                    createMenuCard('น้ำเก๊กฮวยเย็น (เหยือก)', 59);
                    createMenuCard('ชาเขียวรีฟิล', 39);
                    createMenuCard('ไอศกรีมช็อกโกแลตฟัดจ์', 35);
                    createMenuCard('เฉาก๊วยนมสดโบราณ', 29);
                </script>
            </div>
        </div>

    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 z-50 shadow-2xl">
        <div class="max-w-md mx-auto">
            <h3 class="font-bold text-sm text-slate-700 mb-1">🛒 ตะกร้าสินค้าปัจจุบัน (ออเดอร์รอบนี้):</h3>
            <div id="cart-container" class="max-h-24 overflow-y-auto mb-3 text-slate-400 italic text-center py-2">ยังไม่มีรายการอาหาร</div>
            
            <div class="flex justify-between items-center mb-3">
                <span class="font-bold text-slate-800">รวมราคาออเดอร์รอบนี้:</span>
                <span class="text-xl font-bold text-rose-600"><span id="total-price">0</span> บาท</span>
            </div>
            <button id="btn-submit" onclick="sendOrder()" class="w-full bg-rose-600 text-white py-3 rounded-xl font-bold text-lg shadow-lg hover:bg-rose-700 transition">🚀 ส่งรายการเข้าครัว</button>
        </div>
    </div>

    <script>
        const socket = io(window.location.origin);
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('table') || "X";

        socket.emit('check-table-status', { table: tableNum }, (response) => {
            if (response.status !== 'active') {
                Swal.fire({
                    title: 'ไม่สามารถสั่งอาหารได้!',
                    text: response.message,
                    icon: 'error',
                    showConfirmButton: false,
                    allowOutsideClick: false
                });
            } else {
                document.getElementById('main-body').classList.remove('hidden');
                document.getElementById('table-heading').innerText = tableNum;
                startTimer(response.expires);
            }
        });

        let timerInterval;
        function startTimer(expiresAt) {
            timerInterval = setInterval(() => {
                const timeLeft = expiresAt - Date.now();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    lockOrderScreen('หมดเวลานั่งทานอาหาร 90 นาทีแล้วครับ');
                    return;
                }
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                document.getElementById('timer').innerText = `เหลือเวลา: ${minutes}:${seconds < 10 ? '0':''}${seconds}`;
            }, 1000);
        }

        function lockOrderScreen(msg) {
            document.getElementById('timer').innerText = "หมดสิทธิ์สั่ง";
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.className = "w-full bg-slate-400 text-white py-3 rounded-xl font-bold text-lg cursor-not-allowed";
            btn.innerText = "ไม่สามารถสั่งออเดอร์ได้";
            Swal.fire('แจ้งเตือน', msg, 'warning');
        }

        let cart = {};
        window.changeQty = (name, price, num) => {
            if (!cart[name]) cart[name] = { price, qty: 0 };
            cart[name].qty += num;
            if (cart[name].qty <= 0) delete cart[name];
            renderCart();
        };

        function renderCart() {
            const container = document.getElementById('cart-container');
            container.innerHTML = ''; let total = 0;
            Object.keys(cart).forEach(name => {
                total += cart[name].price * cart[name].qty;
                container.innerHTML += `<div class="flex justify-between text-sm py-1 border-b"><span>🔹 ${name} (x${cart[name].qty})</span><span>${cart[name].price * cart[name].qty} บ.</span></div>`;
            });
            if(Object.keys(cart).length === 0) container.innerHTML = 'ยังไม่มีรายการอาหาร';
            document.getElementById('total-price').innerText = total;
        }

        window.sendOrder = () => {
            if(Object.keys(cart).length === 0) return Swal.fire('ตะกร้าว่าง', 'เลือกอาหารก่อนส่งครับ', 'warning');
            
            const items = Object.keys(cart).map(name => ({ name, qty: cart[name].qty, price: cart[name].price }));
            const totalPrice = Object.keys(cart).reduce((sum, name) => sum + (cart[name].price * cart[name].qty), 0);

            socket.emit('submit-order', { table: tableNum, items, totalPrice }, (res) => {
                if (res.success) {
                    Swal.fire('สำเร็จ!', 'ส่งออเดอร์เข้าห้องครัวแล้วครับ', 'success');
                    cart = {}; renderCart();
                } else {
                    lockOrderScreen(res.message);
                }
            });
        };
    </script>
</body>
</html>
