<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้านร้านอาหาร (Socket.io)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-white p-6">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl h-fit">
            <h2 class="text-xl font-bold mb-4 text-amber-400">🚪 ระบบเปิดโต๊ะอาหาร (Socket)</h2>
            <div class="mb-4">
                <label class="block text-sm mb-1">ระบุเลขโต๊ะ:</label>
                <input type="number" id="table-input" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-white font-bold text-center text-xl">
            </div>
            <button onclick="generateTableQR()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded transition">
                ⚡ สร้าง QR Code (90 นาที)
            </button>
            <div class="mt-6 flex flex-col items-center bg-white p-4 rounded-xl text-black">
                <div id="qrcode"></div>
                <p id="qr-label" class="text-xs font-bold mt-2 text-gray-600 text-center">ยังไม่ได้สร้าง QR</p>
            </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl md:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-emerald-400">🍳 รายการออเดอร์ห้องครัว (Real-time)</h2>
            <div id="order-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-black">
                <p class="text-gray-400 italic text-center w-full py-4">เชื่อมต่อเซิร์ฟเวอร์...</p>
            </div>
        </div>
    </div>

    <script>
        // เชื่อมต่อไปยัง Server หลังบ้าน
        const socket = io(window.location.origin);

        window.generateTableQR = () => {
            const tableNum = document.getElementById('table-input').value;
            if(!tableNum) return alert('กรุณากรอกเลขโต๊ะ');

            const expireTime = Date.now() + (90 * 60 * 1000); 
            const orderURL = `${window.location.origin}/table.html?table=${tableNum}&expires=${expireTime}`;

            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: orderURL, width: 180, height: 180 });
            document.getElementById("qr-label").innerText = `โต๊ะ ${tableNum} (หมดอายุใน 90 นาที)`;

            // 🆕 จุดที่แก้ไขเพิ่ม: ส่งข้อมูลไปลงทะเบียนเปิดโต๊ะที่ server.js ทันทีเมื่อกดปุ่ม
            socket.emit('open-table', { table: tableNum, expires: expireTime });
        };

        // รับออเดอร์มาวาดหน้าจอใหม่ทุกครั้งที่อัปเดต
        socket.on('init-orders', renderOrders);
        socket.on('order-updated', renderOrders);

        function renderOrders(activeOrders) {
            const orderList = document.getElementById('order-list');
            orderList.innerHTML = ''; 

            const keys = Object.keys(activeOrders);
            if (keys.length === 0) {
                orderList.innerHTML = '<p class="text-gray-400 italic text-center w-full py-4">ยังไม่มีออเดอร์</p>';
                return;
            }

            keys.forEach(id => {
                const order = activeOrders[id];
                const orderBox = document.createElement('div');
                orderBox.className = `p-4 rounded-xl shadow border ${order.status === 'เสิร์ฟแล้ว' ? 'bg-gray-100 border-gray-300' : 'bg-amber-50 border-amber-300'}`;
                
                const itemsText = order.items.map(i => `${i.name} x${i.qty}`).join(', ');

                orderBox.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-lg font-bold">โต๊ะ ${order.table}</span>
                        <span class="text-sm px-2 py-1 rounded ${order.status === 'เสิร์ฟแล้ว' ? 'bg-green-200 text-green-800' : 'bg-amber-200 text-amber-800'}">${order.status}</span>
                    </div>
                    <p class="text-gray-700 mb-2"><b>รายการ:</b> ${itemsText}</p>
                    <p class="text-sm text-gray-500 mb-3">รวมราคา: ${order.totalPrice} บาท</p>
                    <div class="flex space-x-2">
                        ${order.status === 'กำลังทำ' ? `<button onclick="socket.emit('mark-done', '${id}')" class="bg-green-500 text-white text-xs px-3 py-1 rounded font-bold">เสิร์ฟแล้ว</button>` : ''}
                        <button onclick="if(confirm('ยืนยันเช็คบิล?')) socket.emit('clear-table', '${order.table}')" class="bg-red-500 text-white text-xs px-3 py-1 rounded font-bold">เช็คบิล</button>
                    </div>
                `;
                orderList.appendChild(orderBox);
            });
        }
    </script>
</body>
</html>
